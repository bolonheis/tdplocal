# Integration overlay: wires this component to the other TDP components in
# ${TDP_NAMESPACE}, assuming each is deployed with its default Application name
# (the Helm release name) from this kit. Layered by ArgoCD after values.yaml and
# values-gitops.yaml; delete this file to deploy the component stand-alone.
#
# Object storage is tdp-ozone's S3 Gateway. Ozone ships with security off
# (tdp-ozone/values-gitops.yaml), so the gateway does not validate signatures:
# the access key is only used as the Ozone user name and the secret is ignored.
# With security on, tdp-ozone's Secret "ozone-s3-credentials" exists and Hue
# reads the real keys from it instead.
#
# Hue's "Files" HDFS root goes through tdp-ozone's HttpFS gateway, which needs
# Kerberos (tdp-ozone values-tdp-httpfs.yaml) and is off in this kit: that root
# errors when opened, while the S3 entry works.

tdp-hue:
  hue:
    # SQL editors, one per engine this kit deploys. Queries run as the
    # logged-in Hue user: ${USER} (Trino identity, no password while Trino is
    # unauthenticated) and ${USER}:${PASSWORD} (Hue asks each user for their
    # own ClickHouse / PostgreSQL login). Trino's catalogs come from
    # tdp-trino/values-integration.yaml. Spark SQL connects to the Thrift
    # Server set in [spark] below. Replaces the chart's list as a whole, so
    # keep "trino" and "sparksql": the chart's [notebook] section lists them.
    interpreters: |
      [[[trino]]]
        name = Trino
        interface=sqlalchemy
        options='{"url": "trino://${USER}@tdp-trino.${TDP_NAMESPACE}.svc.cluster.local:8080/iceberg"}'

      [[[trino_hive]]]
        name = Trino (Hive)
        interface=sqlalchemy
        options='{"url": "trino://${USER}@tdp-trino.${TDP_NAMESPACE}.svc.cluster.local:8080/hive"}'

      [[[sparksql]]]
        name = Spark SQL
        interface=hiveserver2

      [[[clickhouse]]]
        name = ClickHouse
        interface=sqlalchemy
        options='{"url": "clickhouse+http://${USER}:${PASSWORD}@clickhouse-tdp-clickhouse.${TDP_NAMESPACE}.svc.cluster.local:8123/default"}'

      [[[postgresql]]]
        name = PostgreSQL (tdp-postgresql)
        interface=sqlalchemy
        options='{"url": "postgresql://${USER}:${PASSWORD}@tdp-postgresql.${TDP_NAMESPACE}.svc.cluster.local:5432/postgres"}'

  # Hosts in the chart's `ini` that point at other components: overridden key
  # by key (rendered as zzy-tdp-extra.ini, loaded after the chart's own INI).
  tdp:
    extraIni: |
      [hadoop]
      [[hdfs_clusters]]
      [[[default]]]
      webhdfs_url=http://tdp-ozone-httpfs.${TDP_NAMESPACE}.svc.cluster.local:14000/webhdfs/v1

      [spark]
      sql_server_host=tdp-spark-thriftserver.${TDP_NAMESPACE}.svc.cluster.local

      [aws]
      [[aws_accounts]]
      [[[default]]]
      host=tdp-ozone-s3g-rest.${TDP_NAMESPACE}.svc.cluster.local:9878

  # S3 keys: tdp-ozone's Secret when it exists, otherwise the placeholder
  # identity "hue" (see the header). NOT real credentials.
  aws:
    accessKeyIdScript: "cat /etc/hue/secrets/s3-access-key-id 2>/dev/null || echo hue"
    secretAccessKeyScript: "cat /etc/hue/secrets/s3-secret-access-key 2>/dev/null || echo ozone-unsecured"
