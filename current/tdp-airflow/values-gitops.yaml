# GitOps overlay, layered by ArgoCD on top of values.yaml (see the Application
# manifest next to this file). values.yaml is replaced by the chart defaults on
# every release; this file is not, so GitOps-specific defaults live here.
#
# standard / nginx come from variables.env. When one is
# empty the key renders as null, which removes it and falls back to the chart /
# cluster default (default StorageClass, default IngressClass).

tdp-airflow:
  # Component passwords: TDP_*_PASSWORD from variables.env, filled in by deploy.sh.
  # Kept here, not in values.yaml, because scripts/sync-values-from-charts.sh
  # overwrites values.yaml with the chart defaults.
  webserver:
    defaultUser:
      password: "TS4Y4RJmzMv_TQ95op22"
  data:
    metadataConnection:
      pass: "pbKCjU25bND3i6sRMXcY"
  postgresql:
    auth:
      postgresPassword: "pbKCjU25bND3i6sRMXcY"
  # Under ArgoCD, Helm post-install hooks become PostSync hooks, which only run
  # after every resource is healthy, while the Airflow pods wait for the
  # migrations before becoming healthy: a deadlock. Run both Jobs as Sync hooks
  # instead (recreated on every sync, so the immutable Job spec never blocks).
  migrateDatabaseJob:
    useHelmHooks: false
    jobAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  createUserJob:
    useHelmHooks: false
    jobAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

  dags:
    persistence:
      storageClassName: standard
  logs:
    persistence:
      storageClassName: standard
  workers:
    persistence:
      storageClassName: standard
  triggerer:
    # Disabled: with node-local storage (e.g. local-path) the triggerer's own
    # logs PVC and the shared dags PVC can land on different nodes, leaving the
    # pod unschedulable ("volume node affinity conflict"). Without it the
    # triggerer runs as a Deployment (logs on emptyDir, like the other
    # components while logs.persistence is off) and follows the dags PVC.
    persistence:
      enabled: false
      storageClassName: standard

ingress:
  ingressClassName: nginx

# Exposure (TDP_EXPOSE / deploy.sh -e: ingress | gatewayapi | none). The two
# switches are mutually exclusive; deploy.sh sets them from TDP_EXPOSE.
TDP-Settings:
  gateway:
    ingress:
      enabled: true
    gatewayApi:
      enabled: false

gatewayApi:
  # Gateway API: the shared Gateway the HTTPRoutes attach to (TDP_GATEWAY_NAME /
  # TDP_GATEWAY_NAMESPACE). An entry without a name is skipped by the chart.
  parentRefs:
    - name: 
      namespace: 
  # Use the shared Gateway above, not one per chart. Also required by the charts:
  # with gatewayApi on, their Gateway template reads gatewayApi.gateway.enabled.
  gateway:
    enabled: false
