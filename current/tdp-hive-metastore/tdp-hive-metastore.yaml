apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdp-hive-metastore
  namespace: tdp
  labels:
    tecnisys.io/cluster: tdp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tdp

  sources:
  - repoURL: registry.engtecnisys.com.br/tdp-dev/charts
    targetRevision: 3.0.2-117.2
    chart: tdp-hive-metastore
    helm:
      # values-gitops.yaml / values-integration.yaml are optional overlays:
      # delete one to opt out of it (missing files are skipped).
      # values-ozone-security.yaml exists only with TDP_OZONE_SECURITY=true
      # (enable-ozone-security.sh).
      ignoreMissingValueFiles: true
      valueFiles:
      - $values/current/tdp-hive-metastore/values.yaml
      - $values/current/tdp-hive-metastore/values-gitops.yaml
      - $values/current/tdp-hive-metastore/values-integration.yaml
      - $values/current/tdp-hive-metastore/values-ozone-security.yaml
  
  - repoURL: 'https://github.com/bolonheis/tdplocal/'
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tdp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  # tdp-license-operator scales licensed Deployments to zero on license expiry;
  # do not let self-heal revert it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
