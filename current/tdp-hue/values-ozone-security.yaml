# Ozone security overlay: layered by ArgoCD last, after values-integration.yaml.
# deploy.sh renders it only with TDP_OZONE_SECURITY=true
# (enable-ozone-security.sh); otherwise the file does not exist and the
# Application skips it.
#
# Hue already reads tdp-ozone's Secret "ozone-s3-credentials" when it exists.
# This only drops values-integration.yaml's placeholder fallback, so Hue never
# sends placeholder keys to a gateway that validates them: if the Secret is not
# filled yet when Hue starts, S3 stays hidden until Hue is restarted.

tdp-hue:
  aws:
    accessKeyIdScript: "cat /etc/hue/secrets/s3-access-key-id 2>/dev/null || true"
    secretAccessKeyScript: "cat /etc/hue/secrets/s3-secret-access-key 2>/dev/null || true"
