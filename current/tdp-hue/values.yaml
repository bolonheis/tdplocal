# ==============================================================================
# TDP (Tecnisys Data Platform) - Tecnisys
# Helm chart values for Hue (SQL Cloud Editor)
#
# Usage:
# - Edit this file to configure the chart.
# - Prefer placeholders over real secrets; provide secrets via Kubernetes Secret
#   or via Helm --set / external tooling.
# - Keep a single source of truth: values.yaml.
# ==============================================================================

# Enable/disable Hue deployment
tdp-hue:
  enabled: true

  # TDP patch to the vendored chart (stack/charts/upstream/hue/hue,
  # templates/_tdp-names.tpl): re-bases its hardcoded resource names —
  # Deployment/Service "tdp-hue" (pods tdp-hue-<hash>), ConfigMaps
  # "tdp-hue-config", "tdp-hue-config-extra", "tdp-hue-hive-config", and
  # tdp-hue-<name> for every optional workload below. Labels are unchanged
  # (pods still carry pod=hue, which tdp-ozone's HttpFS NetworkPolicy uses).
  resourceBaseName: tdp-hue

  # TDP Hue image (stack/images/hue): gethue/hue:20260611-140101 plus the
  # clickhouse-sqlalchemy driver the `clickhouse` interpreter needs (Hue's
  # bundled ClickHouse driver fails every CREATE/INSERT/DROP — see that
  # Dockerfile). Tag = "<Hue version>-<n>" — Hue 4.11.0 (the base image's
  # /usr/share/hue/VERSION, = Chart.yaml appVersion) plus a TDP revision
  # starting at 0, bumped on every rebuild of the same Hue version. The base is the last
  # dated tag Docker Hub published for gethue/hue (daily dated tags stopped
  # after 2026-06-11; every tag since, including `latest`, resolves to the
  # same digest), so upgrades stay explicit. The upstream chart always
  # renders "<image.registry>/hue:<image.tag>" (and
  # "<image.registry>/nginx:<image.tag>" for the disabled balancer sidecar)
  # — there's no repository field, `image.registry` doubles as the path.
  # pullSecrets is a TDP patch to the vendored chart (templates/_tdp-names.tpl).
  image:
    registry: "registry.tecnisys.com.br/tdp/images"
    tag: "4.11.0-0"
    pullPolicy: "IfNotPresent"
    pullSecrets:
      - tdp-registry

  # License opt-in, on both levels the license operator reads (see
  # stack/manifests/platform/tdp-platform-license.yaml; requires tdp-crds
  # and tdp-license):
  # - `labels`: the hue Deployment's own metadata.labels (a TDP patch to the
  #   vendored chart, which hardcodes them). Expiry scaling and the webhook
  #   act only on workloads that carry tecnisys.com/licensed: "true".
  # - `podLabels`: the hue pods, which the operator counts against the
  #   license's worker-node limit and evicts from on pod enforcement.
  labels:
    tecnisys.io/cluster: "tdp"
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-hue
  podLabels:
    tecnisys.io/cluster: "tdp"
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-hue

  hue:
    replicas: 1

    # ── Metadata database ─────────────────────────────────────────────────
    # The upstream Hue chart's own bundled PostgreSQL (`postgres:9.5`,
    # hardcoded, no version override hook) is unsupported by current Hue —
    # it requires PostgreSQL 12+. `create: false` here permanently disables
    # that Deployment/PV/PVC; the `postgresql` block below (a real,
    # independent Helm dependency — the same chart/version tdp-postgresql
    # wraps) replaces it instead.
    #
    # - `postgresql.enabled: true` (default): a dedicated PostgreSQL 17.5
    #   instance is deployed for this Hue release (fixed service name
    #   "tdp-hue-postgresql" — see the `postgresql` block below).
    # - `postgresql.enabled: false`: nothing is deployed; point Hue at an
    #   already-installed tdp-postgresql (or any reachable PostgreSQL 12+)
    #   by overriding host/user/password/name below. See
    #   values-tdp-postgresql.yaml for a ready-made example.
    database:
      create: false
      engine: "postgresql_psycopg2"
      host: "tdp-hue-postgresql"
      port: 5432
      user: "hue"
      # No password in values: Hue reads it at startup from the Secret
      # tdp.databaseSecret (key "password"), mounted at /etc/hue/secrets —
      # the bundled PostgreSQL's own Secret by default. Keep `password` empty:
      # the upstream template renders password_script only when it's set.
      password: ""
      password_script: "cat /etc/hue/secrets/db-password"
      name: "hue"

    # SQLAlchemy interpreters exposed in Hue's SQL editor, one per queryable
    # TDP component. `trino` and `trino_kafka` point at a live demo Trino
    # deployment (stack/charts/tdp/tdp-trino, installed with a
    # postgresql + kafka catalog overlay — see
    # docs/tdp-hue-manager-integration.md and the tdp-trino README for how to
    # reproduce) — both catalogs verified live via `trino --execute` before
    # wiring these in. Cross-catalog queries work from either entry (e.g.
    # `SELECT * FROM kafka.default.orders` works even from the `trino`
    # entry) — `trino_kafka` just jumps straight into that catalog's schema
    # browser. Update host/database if you rebuild this against a different
    # Trino/PostgreSQL release.
    #
    # Identity — queries run as the logged-in Hue user, never a shared
    # account stored here:
    # - ${USER} in a URL is replaced by the Hue username (sql_alchemy.py).
    #   Trino takes it as the X-Trino-User, so no password is needed while
    #   Trino itself is unauthenticated.
    # - ${USER}:${PASSWORD} (postgresql, clickhouse): Hue asks each user for
    #   their own database login on first use and keeps it only in their
    #   session — nothing stored. The database must know that user (e.g.
    #   tdp-clickhouse values-ldap.yaml, PostgreSQL pg_hba "ldap").
    # - Shared service account instead (no impersonation): set
    #   tdp.connectors.shared.<name> below; its URL gets the password from a
    #   Secret at pod start (zzz-hue-secrets.ini overrides this `options`).
    #
    # - trino: general-purpose entry point, default catalog "postgresql".
    # - trino_kafka: same Trino, default catalog "kafka" — the `orders`
    #   topic is exposed with real decoded columns (order_id, customer,
    #   country, amount, status, created_at) via a JSON table description,
    #   not just raw _key/_message bytes.
    # - trino_ozone: catalog-scoped entry for Ozone-backed Hive/Iceberg
    #   tables — commented out because that Trino catalog isn't configured
    #   in this demo (only postgresql + kafka are); uncomment both sides
    #   together (trino.catalogs.hive in stack/charts/tdp/tdp-trino) if
    #   needed later.
    # - postgresql: direct connection to the shared tdp-postgresql instance,
    #   independent of Trino — same demo.sales schema (per-user login).
    # - sparksql: Spark SQL on the tdp-spark cluster through its Spark
    #   Thrift Server (stack/charts/tdp/tdp-spark, tdp-spark.thriftServer —
    #   Service "<release>-thriftserver", port 10000). interface=hiveserver2
    #   connects to the host/port in the [spark] section of `ini` below
    #   (sql_server_host/sql_server_port), not to an `options` URL. Queries
    #   run as Spark jobs on the cluster (executors on the workers); tables
    #   default to s3a://warehouse/spark-warehouse on Ozone. Livy (Scala /
    #   PySpark sessions) isn't offered: no released Livy supports Spark 4.
    #   Not done via the built-in "hive" entry pointed at the same server:
    #   Hue lists databases with a Hive "*" pattern for that dialect (only
    #   sparksql/impala send none), which Spark 4's Thrift Server rejects
    #   ("Dangling meta character '*'"), breaking the database browser.
    # - clickhouse: tdp-clickhouse (stack/charts/tdp/tdp-clickhouse) over its
    #   HTTP interface — Service "clickhouse-<release>" (Altinity operator
    #   naming, needs tdp-operator), port 8123 — through the
    #   clickhouse-sqlalchemy driver added by the TDP Hue image
    #   (stack/images/hue). The URL must say "clickhouse+http://": Hue's own
    #   bundled driver also registers plain "clickhouse" (and breaks on
    #   DDL/INSERT), so the explicit scheme is what selects the new one.
    #   Per-user login; for a shared account use tdp.connectors.shared
    #   (e.g. tdp-clickhouse's "tdpuser" from values-user-tdp.yaml — the
    #   "default" user only accepts local connections).
    interpreters: |
      [[[trino]]]
        name = Trino
        interface=sqlalchemy
        options='{"url": "trino://${USER}@tdp-trino.tdp.svc.cluster.local:8080/postgresql"}'

      [[[trino_kafka]]]
        name = Trino (Kafka)
        interface=sqlalchemy
        options='{"url": "trino://${USER}@tdp-trino.tdp.svc.cluster.local:8080/kafka"}'

      # [[[trino_ozone]]]
      #   name = Trino (Ozone / Data Lake)
      #   interface=sqlalchemy
      #   options='{"url": "trino://<trino-user>@<trino-service>.<namespace>.svc.cluster.local:8080/hive"}'

      [[[postgresql]]]
        name = PostgreSQL (tdp-postgresql)
        interface=sqlalchemy
        options='{"url": "postgresql://${USER}:${PASSWORD}@tdp-postgresql.tdp.svc.cluster.local:5432/demo"}'

      [[[sparksql]]]
        name = Spark SQL
        interface=hiveserver2

      [[[clickhouse]]]
        name = ClickHouse
        interface=sqlalchemy
        options='{"url": "clickhouse+http://${USER}:${PASSWORD}@clickhouse-tdp-clickhouse.tdp.svc.cluster.local:8123/default"}'

    ini: |
      [desktop]
      # secret_key is NOT set here: zz-tdp.ini (templates/tdp-config.yaml)
      # blanks it and sets secret_key_script from the Secret tdp.secretKey.
      # "filebrowser" is NOT blacklisted so the [aws] S3 config (Ozone) is
      # reachable through the UI. It also always lists an HDFS root under
      # "Files" (Hue can't disable HDFS — the image's own hue.ini defines
      # [[hdfs_clusters]] [[[default]]], and any such section counts as
      # enabled), so [hadoop] below points that root at Ozone instead.
      # "oozie" stays blacklisted: TDP has no Oozie component to back the
      # "Schedule" app. search/hbase/security/jobbrowser stay blacklisted
      # too: no Solr, HBase, Sentry, or YARN component in this stack either.
      # "impala" hides the auto-added Impala editor (no Impala in this
      # stack). "beeswax" (Hue's Hive app) must NOT be blacklisted: Hue's
      # notebook core imports beeswax.models at startup (verified: the pod
      # crash-loops with "Model class beeswax.models.QueryHistory ... isn't
      # in an application in INSTALLED_APPS"), and the sparksql interpreter
      # runs on beeswax's HiveServer2 client too.
      app_blacklist=search,hbase,security,jobbrowser,oozie,impala
      django_debug_mode=false
      gunicorn_work_class=sync
      enable_prometheus=true

      [[task_server]]
      enabled=false

      # Hue's HDFS root → Apache Ozone via its HttpFS gateway (WebHDFS API
      # over ofs://; stack/charts/tdp/tdp-ozone, values-tdp-httpfs.yaml —
      # Service "<release>-httpfs", port 14000). Same data as the S3 entry:
      # buckets live under /s3v/<bucket>. "/" itself lists only volumes the
      # logged-in user owns (usually none) — browse to /s3v. Hue calls the
      # gateway as service user "hue" with doAs=<hue user>; tdp-ozone's
      # httpfs.proxyUsers must include "hue" (default) and its NetworkPolicy
      # admits only pod=hue. If tdp-ozone runs without HttpFS, this root
      # just errors when clicked — S3 is unaffected either way.
      # fs_defaultfs is informational here (Hue routes by webhdfs_url).
      [hadoop]
      [[hdfs_clusters]]
      [[[default]]]
      fs_defaultfs=ofs://cluster1
      webhdfs_url=http://tdp-ozone-httpfs.tdp.svc.cluster.local:14000/webhdfs/v1

      # Editor that opens by default, and the top of the editor list. Hue
      # always lists its built-in Hive editor first otherwise — there's no
      # HiveServer2 in this stack, so it fails ("Could not connect to
      # localhost:10000"). default_interpreter matches the interpreter's
      # display NAME; interpreters_shown_on_wheel takes interpreter TYPES and
      # Hue refuses to load the editor list if one isn't defined, so keep it
      # to entries that always exist here.
      [notebook]
      default_interpreter=Spark SQL
      interpreters_shown_on_wheel=sparksql,trino

      # Spark Thrift Server behind the "sparksql" interpreter above
      # (tdp-spark.thriftServer; HiveServer2 binary transport, auth NONE).
      [spark]
      sql_server_host=tdp-spark-thriftserver.tdp.svc.cluster.local
      sql_server_port=10000

      # S3-compatible object storage via Apache Ozone's S3 Gateway
      # (stack/charts/tdp/tdp-ozone, service "<release>-s3g-rest", port 9878
      # — e.g. "tdp-ozone-s3g-rest.tdp.svc.cluster.local:9878" for the
      # default release name). Deep-merges with the [aws] block rendered
      # from tdp-hue.aws.* below (access_key_id/secret_access_key/region) —
      # z-hue.ini and zz-hue.ini layer per-key, not per-section — this just
      # adds the keys the chart's own [aws] template doesn't expose.
      # tdp-ozone runs secured (ozone.security.enabled=true), so the S3
      # Gateway rejects unsigned/unknown keys — tdp-hue.aws.* below must
      # carry a real Ozone S3 access key/secret (see that block).
      # calling_format forces path-style bucket addressing
      # (host/bucket/key instead of bucket.host/key) — required because
      # Ozone's S3 Gateway doesn't support virtual-hosted-style addressing.
      [aws]
      [[aws_accounts]]
      [[[default]]]
      host=tdp-ozone-s3g-rest.tdp.svc.cluster.local:9878
      is_secure=false
      calling_format=boto.s3.connection.OrdinaryCallingFormat

  # nginx sidecar in front of the hue container ("hue-balancer" Service,
  # port 80). Disabled: its bundled nginx config
  # (stack/charts/upstream/hue/hue/templates/configmap-nginx.yaml, hardcoded,
  # no values hook) proxies to gunicorn without `proxy_set_header Host
  # $host`, so nginx falls back to sending `Host: 127.0.0.1:8888` upstream —
  # Django then sees a Host that doesn't match the browser's real Origin and
  # rejects every POST (login included) with a CSRF error. With
  # tdp-hue.hue.replicas=1 this sidecar has no upside anyway (the plain
  # "tdp-hue" Service already load-balances at L4 across replicas via
  # Kubernetes, same as the upstream chart's own NOTES.txt documents as a
  # valid direct-access path). TDP's Ingress/HTTPRoute/port-forward all
  # target "tdp-hue" (port 8888) directly instead — see templates/ingress.yaml.
  balancer:
    enabled: false

  # Optional upstream workloads — all off by upstream default, pinned
  # explicitly here so an upstream default change can't silently add
  # Deployments/CronJobs to a TDP release. The upstream chart hardcodes
  # their names (no tdp-hue prefix, no `.Release.Name`), so they would
  # also fall outside TDP naming if ever enabled.
  # - api: Deployment/Service "hue-api" (gethue.com API demo, not used).
  api:
    enabled: false
  # - workers: Deployments "celery-worker", "celery-flower" and "redis" —
  #   the async task server; stays off together with [[task_server]]
  #   enabled=false in tdp-hue.hue.ini above.
  workers:
    enabled: false
  # - scheduler: Deployment "celery-beat" (requires workers).
  scheduler:
    enabled: false
  # - websocket: Deployment/Service "daphne-websocket" (requires workers).
  websocket:
    enabled: false
  # - cron: CronJob "email-stats" (gethue.com usage-report mailer).
  cron:
    enabled: false
  # - monitoring/alerting: ServiceMonitor / PrometheusRule (need the
  #   Prometheus Operator CRDs, not bundled in TDP); monitoring also adds a
  #   Jaeger sidecar-inject annotation to the hue Deployment. tracing is
  #   declared upstream but no template reads it.
  monitoring:
    enabled: false
  alerting:
    enabled: false
  tracing:
    enabled: false

  # Upstream's own Ingress support is disabled — TDP exposes Hue through its
  # own Ingress/Gateway API templates instead (see TDP-Settings.gateway.*).
  ingress:
    create: false

  # Ozone S3 credentials for the File Browser ([aws] block above). Read at
  # runtime from the Secret tdp.s3CredentialsSecret (tdp-ozone's
  # "ozone-s3-credentials", keys aws_access_key_id/aws_secret_access_key),
  # mounted at /etc/hue/secrets — never in values or ConfigMaps. The
  # *_script keys are a TDP patch to the vendored chart. `|| true`: without
  # that Secret (S3 not used) the keys resolve empty instead of breaking Hue.
  aws:
    accessKeyId: ""
    secretAccessKey: ""
    accessKeyIdScript: "cat /etc/hue/secrets/s3-access-key-id 2>/dev/null || true"
    secretAccessKeyScript: "cat /etc/hue/secrets/s3-secret-access-key 2>/dev/null || true"
    region: "us-east-1"

  # ── TDP secrets, auth and connector identity ───────────────────────────
  # Read by this wrapper's templates (templates/tdp-config.yaml,
  # templates/secret-key.yaml) and by the secret hooks below. Every
  # credential lives in a Kubernetes Secret, projected into the hue pod at
  # /etc/hue/secrets and read by Hue through *_script keys (sh -c).
  tdp:
    # Hue metadata DB password (key "password"). The bundled PostgreSQL's
    # own Secret; for an external database create a Secret with this name
    # (see values-tdp-postgresql.yaml).
    databaseSecret: tdp-hue-postgresql
    # Django secret key (key "secret-key"). Empty = this chart creates
    # "<resourceBaseName>-secret-key" with a random value, kept across
    # upgrades via `lookup`. ArgoCD has no `lookup`, so the key would rotate
    # (logging everyone out) on each sync: there, either name a pre-created
    # Secret in existingSecret or pin the key in `value` (the GitOps kit
    # fills it from TDP_HUE_SECRET_KEY).
    secretKey:
      existingSecret: ""
      value: ""
    # S3 (Ozone) keys for the File Browser — tdp-ozone's Secret. Optional.
    s3CredentialsSecret: ozone-s3-credentials

    # Login. "local" = Hue's own users (first login becomes admin).
    # "ldap" = LDAP/AD (login page choice "LDAP"), keeping a "Local" choice for a
    # break-glass admin (its username must not exist in the directory: an
    # LDAP login with the same name takes the account over). Bind password:
    # Secret "<resourceBaseName>-ldap-bind" key "password"; optional CA:
    # Secret "<resourceBaseName>-ldap-ca" key "ca.crt" (set ldap.caCert).
    # Ready-made overlays: values-tdp-ad.yaml, values-tdp-ldap.yaml.
    auth:
      backend: local
      ldap:
        url: ""
        baseDn: ""
        bindDn: ""
        # AD only: bind as user@ntDomain instead of a search (optional).
        ntDomain: ""
        # Hue defaults this to true; plain ldap:// servers without StartTLS
        # need false. Prefer ldaps:// or StartTLS + caCert in production.
        useStartTls: false
        # true = verify the server cert against Secret <base>-ldap-ca.
        # false = NO verification (Hue's default when ldap_cert is unset).
        caCert: false
        searchBindAuthentication: true
        createUsersOnLogin: true
        syncGroupsOnLogin: true
        # Comma-separated groups allowed to log in (empty = everyone).
        loginGroups: ""
        users:
          filter: "objectclass=*"
          nameAttr: "uid"
        groups:
          filter: "objectclass=*"
          nameAttr: "cn"
          memberAttr: "member"

    # Extra INI, rendered as zzy-tdp-extra.ini — loaded after hue.ini and
    # zz-tdp.ini, so it overrides single keys without repeating the whole
    # `ini` string above (overlays, environment-specific tweaks). Never put
    # secrets here.
    extraIni: ""

    # Hue's own Kerberos service identity (outbound). With hdfs: true Hue
    # authenticates to the HDFS root — tdp-ozone's HttpFS with
    # clientAuthentication: kerberos (tdp-ozone values-tdp-httpfs.yaml) —
    # via SPNEGO, still impersonating the user with doAs. The keytab and
    # krb5.conf come from tdp-ozone: its KDC exports hue/hue@TDP.LOCAL to
    # Secret "tdp-ozone-hue-keytab" (httpfs.clientPrincipals: [hue]) and
    # publishes krb5.conf in ConfigMap "tdp-ozone-kdc-config". Overlay:
    # values-tdp-kerberos.yaml.
    kerberos:
      enabled: false
      principal: "hue/hue@TDP.LOCAL"
      keytabSecret: tdp-ozone-hue-keytab
      # krb5.conf (key "krb5.conf"): an existing ConfigMap, or `inline`
      # content rendered by this chart as ConfigMap <base>-krb5 (needed
      # when Hue must know several realms, e.g. SPNEGO from an AD plus
      # tdp-ozone's TDP.LOCAL).
      krb5Conf:
        configMap: tdp-ozone-kdc-config
        inline: ""
      hdfs: true
      reinitFrequency: 3600
      # Only if the KDC issues renewable tickets (kinit -R); tdp-ozone's
      # internal KDC principals aren't set up for it.
      renewLifetime: false

    # Browser SSO (auth.backend: spnego): acceptor keytab with
    # HTTP/<hue host as users browse it>@<users' realm>, key "keytab".
    # Overlay: values-tdp-spnego.yaml.
    spnego:
      keytabSecret: tdp-hue-spnego-keytab

    # Shared service-account credentials per interpreter (no impersonation).
    # Empty = every connector uses the per-user ${USER}/${PASSWORD} URLs in
    # hue.interpreters. Each entry overrides that interpreter's `options`:
    # "${SECRET}" in url is replaced at pod start by the URL-encoded value of
    # key <secretKey> in Secret "<resourceBaseName>-connectors".
    connectors:
      shared: {}
      # clickhouse:
      #   url: "clickhouse+http://tdpuser:${SECRET}@clickhouse-tdp-clickhouse.tdp.svc.cluster.local:8123/default"
      #   secretKey: clickhouse-password

  # Secret plumbing into the hue pod (hooks added to the vendored chart —
  # stack/charts/upstream/hue/hue/templates/_tdp-names.tpl). Rendered with
  # `tpl` against the subchart, so they follow resourceBaseName/image.
  # Optional sources don't block startup when a Secret doesn't exist.
  extraVolumes:
    - name: tdp-secrets
      projected:
        sources:
          - secret:
              name: '{{ .Values.tdp.databaseSecret }}'
              items:
                - {key: password, path: db-password}
          - secret:
              name: '{{ .Values.tdp.secretKey.existingSecret | default (printf "%s-secret-key" .Values.resourceBaseName) }}'
              items:
                - {key: secret-key, path: secret-key}
          - secret:
              name: '{{ .Values.tdp.s3CredentialsSecret }}'
              optional: true
              items:
                - {key: aws_access_key_id, path: s3-access-key-id}
                - {key: aws_secret_access_key, path: s3-secret-access-key}
          - secret:
              name: '{{ .Values.resourceBaseName }}-ldap-bind'
              optional: true
              items:
                - {key: password, path: ldap-bind-password}
          - secret:
              name: '{{ .Values.resourceBaseName }}-ldap-ca'
              optional: true
              items:
                - {key: ca.crt, path: ldap-ca.crt}
          - secret:
              name: '{{ .Values.tdp.kerberos.keytabSecret }}'
              optional: true
              items:
                - {key: keytab, path: hue.keytab}
          - secret:
              name: '{{ .Values.tdp.spnego.keytabSecret }}'
              optional: true
              items:
                - {key: keytab, path: spnego.keytab}
    - name: tdp-krb5
      configMap:
        name: '{{ if .Values.tdp.kerberos.krb5Conf.inline }}{{ .Values.resourceBaseName }}-krb5{{ else }}{{ .Values.tdp.kerberos.krb5Conf.configMap }}{{ end }}'
        optional: true
        items:
          - {key: krb5.conf, path: krb5.conf}
    - name: tdp-connector-secrets
      secret:
        secretName: '{{ .Values.resourceBaseName }}-connectors'
        optional: true
    - name: tdp-ini
      configMap:
        name: '{{ .Values.resourceBaseName }}-tdp-ini'
    - name: tdp-generated
      emptyDir: {}
  # Hue merges every desktop/conf/*.ini in name order: z-hue.ini (upstream),
  # zz-hue.ini (hue.ini above), zz-tdp.ini (auth + secret_key script),
  # zzz-hue-secrets.ini (shared connector URLs, generated at pod start).
  extraVolumeMounts:
    - name: tdp-secrets
      mountPath: /etc/hue/secrets
      readOnly: true
    - name: tdp-ini
      mountPath: /usr/share/hue/desktop/conf/zz-tdp.ini
      subPath: zz-tdp.ini
      readOnly: true
    - name: tdp-ini
      mountPath: /usr/share/hue/desktop/conf/zzy-tdp-extra.ini
      subPath: zzy-tdp-extra.ini
      readOnly: true
    - name: tdp-krb5
      mountPath: /etc/hue/krb5
      readOnly: true
    - name: tdp-generated
      mountPath: /usr/share/hue/desktop/conf/zzz-hue-secrets.ini
      subPath: zzz-hue-secrets.ini
      readOnly: true
  # Writes zzz-hue-secrets.ini: connectors.tmpl with each ${SECRET:<key>}
  # replaced by the URL-encoded Secret value (fails the pod on a missing key).
  extraInitContainers:
    - name: tdp-render-connectors
      image: '{{ .Values.image.registry }}/hue:{{ .Values.image.tag }}'
      imagePullPolicy: '{{ .Values.image.pullPolicy }}'
      command:
        - /usr/share/hue/build/env/bin/python
        - -c
        - |
          import pathlib, re, urllib.parse
          src = pathlib.Path("/etc/hue/tdp/connectors.tmpl").read_text()
          sec = pathlib.Path("/etc/hue/secrets/connectors")
          def sub(m):
              return urllib.parse.quote((sec / m.group(1)).read_text().strip(), safe="")
          pathlib.Path("/etc/hue/generated/zzz-hue-secrets.ini").write_text(
              re.sub(r"\$\{SECRET:([A-Za-z0-9_.-]+)\}", sub, src))
      volumeMounts:
        - {name: tdp-ini, mountPath: /etc/hue/tdp, readOnly: true}
        - {name: tdp-connector-secrets, mountPath: /etc/hue/secrets/connectors, readOnly: true}
        - {name: tdp-generated, mountPath: /etc/hue/generated}
  # Kerberos client/acceptor config for kinit, kt_renewer, requests-kerberos
  # and SPNEGO. Harmless when Kerberos is off (nothing reads them then).
  extraEnv:
    - name: KRB5_CONFIG
      value: /etc/hue/krb5/krb5.conf
    - name: KRB5_KTNAME
      value: /etc/hue/secrets/spnego.keytab
  # Roll the pod when the TDP auth/secret settings change (zz-tdp.ini lives
  # in a wrapper ConfigMap the subchart can't checksum itself).
  extraConfigChecksum: '{{ toJson .Values.tdp | sha256sum | trunc 16 }}'

# ------------------------------------------------------------------------------
# Bundled PostgreSQL (own Helm dependency — same chart/version tdp-postgresql
# wraps: stack/charts/upstream/postgresql/postgresql, Bitnami postgresql
# 16.7.21 / PostgreSQL 17.5.0). Deployed by default so `tdp-hue` works
# out of the box; set `enabled: false` and fill in `tdp-hue.hue.database.*`
# above to use an existing tdp-postgresql release instead (see
# values-tdp-postgresql.yaml). `fullnameOverride` is a fixed, non-templated
# name (matches the upstream Hue chart's own hardcoded resource names —
# only one tdp-hue release is supported per namespace anyway) so
# `tdp-hue.hue.database.host` can reference it as a plain string; the
# upstream Hue chart does not run values through `tpl`, so a
# `{{ .Release.Name }}`-style value would render literally, unresolved.
# ------------------------------------------------------------------------------
postgresql:
  enabled: true
  fullnameOverride: "tdp-hue-postgresql"

  # `commonLabels` lands on each resource's own metadata.labels (verified via
  # `helm template`), carrying the same licensing opt-in as the rest of the
  # chart. See the `tdp-hue.podLabels` comment above.
  commonLabels:
    tecnisys.io/cluster: tdp
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-hue

  # Passwords left empty: the Bitnami chart generates random ones into the
  # Secret "tdp-hue-postgresql" (keys postgres-password / password) and keeps
  # them across upgrades via `lookup`; Hue reads "password" from that Secret
  # (tdp-hue.tdp.databaseSecret). With ArgoCD (no `lookup`) pre-create the
  # Secret and set auth.existingSecret, or set both passwords (the GitOps kit
  # fills them from TDP_HUE_DB_PASSWORD) — otherwise every sync regenerates
  # them and Hue can no longer log in to the already-initialized database.
  auth:
    postgresPassword: ""
    username: "hue"
    password: ""
    database: "hue"

  # Use a subdirectory inside the PVC for PostgreSQL data. Required for
  # OpenShift: avoids permission errors on the volume root because OpenShift
  # assigns dynamic UIDs and chmod on the mount root fails.
  postgresqlDataDir: /bitnami/postgresql/data/pgdata

  primary:
    podLabels:
      tecnisys.io/cluster: tdp
    persistence:
      enabled: true
      storageClass: ""
      size: 2Gi
    podSecurityContext:
      enabled: true
      fsGroup: null
    containerSecurityContext:
      enabled: true
      runAsUser: null
      runAsGroup: null

  volumePermissions:
    enabled: false

# ------------------------------------------------------------------------------
# Start folder of Hue's "Files" (templates/home-directory-job.yaml). Hue
# hardcodes every user's home to "/user/<username>" (no config key) and opens
# Files there — on Ozone that path doesn't exist, so Files would open on an
# error. A post-install/upgrade Job installs a PostgreSQL trigger on Hue's
# useradmin_userprofile table that swaps that default for `path`, for existing
# users and every user created later. "/s3v" = Ozone's S3 volume (all S3
# buckets), browsed through the HDFS root (see [hadoop] in tdp-hue.hue.ini).
# Set path: "" to drop the trigger and restore "/user/<username>".
# ------------------------------------------------------------------------------
homeDirectory:
  path: /s3v
  # Any image with bash + psql; same PostgreSQL image the bundled database uses.
  image: registry.tecnisys.com.br/community/images/bitnamilegacy/postgresql:17.5.0-debian-12-r20

# ------------------------------------------------------------------------------
# TDP Ingress (own template, templates/ingress.yaml) — not the upstream
# chart's `tdp-hue.ingress.*` block above, which stays disabled
# (tdp-hue.ingress.create: false). Targets the "tdp-hue" Service directly
# (hardcoded in the template, same as every other TDP chart's ingress.yaml)
# — not "hue-balancer", see the tdp-hue.balancer comment above for why.
# Gated purely by TDP-Settings.gateway.ingress.enabled below — same
# convention as tdp-clickhouse/tdp-jupyter/tdp-ranger/tdp-kafka/tdp-airflow.
# ------------------------------------------------------------------------------
ingress:
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: hue.tdp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration for exposing the Hue UI
# Used when TDP-Settings.gateway.gatewayApi.enabled is true
gatewayApi:
  gatewayClassName: ""
  gateway:
    enabled: false
    name: ""
    listeners: []
  parentRefs: []
  hue:
    enabled: true
    hostnames:
      - hue.tdp.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: tdp-hue
            port: 8888
    tls:
      certificateRefs: []

# TDP-specific configurations
# Single source of truth for all TDP platform controls.
TDP-Settings:
  # Gateway configuration controls which network exposure method is used.
  # Ingress and Gateway API are mutually exclusive — only one should be enabled.
  gateway:
    ingress:
      enabled: true
    gatewayApi:
      enabled: false

# Install-time license gate (templates/tdp-license-check.yaml, the same file in
# every TDP component chart). helm install/upgrade fails, and an ArgoCD sync
# fails in its PreSync hook, unless tdp-license-operator is running and a
# PlatformLicense covering this chart's product is VALID or WARNING. Install the
# operator and the license first: scripts/tdp-license-install.sh (Helm) or
# deploy.sh --install (GitOps kit).
licenseCheck:
  # Product the license must cover. Empty means the chart name; a PlatformLicense
  # with spec.product "*" covers every chart.
  product: ""
  # How recently the operator must have verified the license, which proves it is
  # still running (it re-verifies every 30s by default).
  maxStatusAgeSeconds: 600
  # Hook Job used when the chart is rendered without cluster access (ArgoCD):
  # any image with bash, kubectl, grep and GNU date.
  image: registry.tecnisys.com.br/community/images/bitnamilegacy/kubectl:latest
  imagePullSecrets:
    - name: tdp-registry
