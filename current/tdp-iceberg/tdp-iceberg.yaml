apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdp-iceberg
  namespace: tdp
  labels:
    tecnisys.io/cluster: tdp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tdp

  sources:
  - repoURL: registry.tecnisys.com.br/tdp/charts
    targetRevision: 3.0.2
    chart: tdp-iceberg
    helm:
      # values-gitops.yaml / values-integration.yaml are optional overlays:
      # delete one to opt out of it (missing files are skipped).
      ignoreMissingValueFiles: true
      valueFiles:
      - $values/current/tdp-iceberg/values.yaml
      - $values/current/tdp-iceberg/values-gitops.yaml
      - $values/current/tdp-iceberg/values-integration.yaml
  
  - repoURL: 'https://github.com/bolonheis/tdplocal/'
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tdp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
