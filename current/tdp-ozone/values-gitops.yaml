# GitOps overlay, layered by ArgoCD on top of values.yaml (see the Application
# manifest next to this file). values.yaml is replaced by the chart defaults on
# every release; this file is not, so GitOps-specific defaults live here.
#
# standard / nginx come from variables.env. When one is
# empty the key renders as null, which removes it and falls back to the chart /
# cluster default (default StorageClass, default IngressClass).

tdp-ozone:
  kerberos:
    kdc:
      persistence:
        storageClassName: standard
  datanode:
    persistence:
      storageClassName: standard
  om:
    persistence:
      storageClassName: standard
  scm:
    persistence:
      storageClassName: standard
  s3g:
    persistence:
      storageClassName: standard
    # S3 auth needs Ozone security, which only comes with Kerberos
    # (kerberos.enabled, via the chart's values-tdp-kerberos.yaml overlay). With
    # Kerberos off, the s3-secret-provision Job's `ozone s3 getsecret` always
    # fails ("works only when security is enabled") and the sync never goes
    # green. Keep these two in step: enable both, or neither.
    auth:
      enabled: false

  ingress:
    s3g:
      rest:
        ingressClassName: nginx
      web:
        ingressClassName: nginx
    om:
      ingressClassName: nginx
    scm:
      ingressClassName: nginx
    recon:
      ingressClassName: nginx
