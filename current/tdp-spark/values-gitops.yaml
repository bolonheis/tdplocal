# GitOps overlay, layered by ArgoCD on top of values.yaml (see the Application
# manifest next to this file). values.yaml is replaced by the chart defaults on
# every release; this file is not, so GitOps-specific defaults live here.
#
# standard / nginx come from variables.env. When one is
# empty the key renders as null, which removes it and falls back to the chart /
# cluster default (default StorageClass, default IngressClass).

spark:
  # e2e test (branch 117), test environment only: spark:4.0.2-2 is not on
  # registry.tecnisys.com.br/tdp yet (checked 2026-10-06), so this docker-desktop
  # test pulls it from the dev Harbor (tdp-registry holds both hosts).
  image:
    registry: ""
    repository: registry.engtecnisys.com.br/tdp-dev/images/spark
  # Spark Master UI Ingress (the subchart's own; on in TDP_EXPOSE=ingress). The
  # Master serves its links root-relative (/proxy/<worker>, /app/...), so no
  # spark.ui.reverseProxyUrl is set and port-forward keeps working too. Only a
  # worker page's "Back to Master" link shows the in-cluster master address.
  ingress:
    enabled: true
    hostname: spark.tdp.local
    ingressClassName: nginx
    pathType: Prefix
  storage:
    persistentVolume:
      storageClass: standard
    shared:
      persistentVolume:
        storageClass: standard
  historyServer:
    # Used only when historyServer.eventLog.persistence is on
    eventLog:
      persistence:
        storageClass: standard
    ingress:
      ingressClassName: nginx

# Exposure (TDP_EXPOSE / deploy.sh -e: ingress | gatewayapi | none). The two
# switches are mutually exclusive; deploy.sh sets them from TDP_EXPOSE.
TDP-Settings:
  gateway:
    ingress:
      enabled: true
    gatewayApi:
      enabled: false

gatewayApi:
  # Gateway API: the shared Gateway the HTTPRoutes attach to (TDP_GATEWAY_NAME /
  # TDP_GATEWAY_NAMESPACE). An entry without a name is skipped by the chart.
  parentRefs:
    - name: 
      namespace: 
  # Use the shared Gateway above, not one per chart. Also required by the charts:
  # with gatewayApi on, their Gateway template reads gatewayApi.gateway.enabled.
  gateway:
    enabled: false
  # Spark Master UI route (on in TDP_EXPOSE=gatewayapi, at spark.tdp.local)
  spark:
    enabled: true
